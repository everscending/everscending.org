<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link
            rel="icon"
            type="image/png"
            href="src/assets/seed-of-life-light.svg"
        />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>༺ everscending ༻</title>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/vanta@0.5.24/dist/vanta.waves.min.js"></script>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="src/main.tsx"></script>
        <div
            id="animation-container"
            style="
                position: fixed;
                top: 0px;
                left: 0px;
                width: 100%;
                height: 100%;
                z-index: -1;
            "
        ></div>
        <script>
            VANTA.WAVES({
                el: "#animation-container",
                mouseControls: true,
                touchControls: true,
                gyroControls: false,
                minHeight: 200.0,
                minWidth: 200.0,
                scale: 1.0,
                scaleMobile: 1.0,
                color: 0x0,
                shininess: 50.0,
                waveHeight: 10.5,
                waveSpeed: 0.3,
                zoom: 0.98,
            });
        </script>
    </body>
</html>
